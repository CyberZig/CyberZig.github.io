<script>
/* ================= CONFIG ================= */
const STORE_KEY='infosecAcademy.v3', THEME_KEY='infosecAcademy.theme';
const QUIZ_SEC=60, EXAM_SEC=40, POINTS=10, STREAK_BONUS=5, PAGES=5;

const PAL={
 sky:{tile:'bg-sky-100',text:'text-sky-700',bar:'bg-sky-500',btn:'bg-sky-600 hover:bg-sky-700',border:'hover:border-sky-300'},
 indigo:{tile:'bg-indigo-100',text:'text-indigo-700',bar:'bg-indigo-500',btn:'bg-indigo-600 hover:bg-indigo-700',border:'hover:border-indigo-300'},
 rose:{tile:'bg-rose-100',text:'text-rose-700',bar:'bg-rose-500',btn:'bg-rose-600 hover:bg-rose-700',border:'hover:border-rose-300'},
 teal:{tile:'bg-teal-100',text:'text-teal-700',bar:'bg-teal-500',btn:'bg-teal-600 hover:bg-teal-700',border:'hover:border-teal-300'},
 violet:{tile:'bg-violet-100',text:'text-violet-700',bar:'bg-violet-500',btn:'bg-violet-600 hover:bg-violet-700',border:'hover:border-violet-300'},
 emerald:{tile:'bg-emerald-100',text:'text-emerald-700',bar:'bg-emerald-500',btn:'bg-emerald-600 hover:bg-emerald-700',border:'hover:border-emerald-300'},
 orange:{tile:'bg-orange-100',text:'text-orange-700',bar:'bg-orange-500',btn:'bg-orange-600 hover:bg-orange-700',border:'hover:border-orange-300'}
};
const CALLOUT={
 rose:{box:'border-rose-500 bg-rose-50',title:'text-rose-700',icon:'⚠️'},
 amber:{box:'border-amber-500 bg-amber-50',title:'text-amber-800',icon:'💡'},
 sky:{box:'border-sky-500 bg-sky-50',title:'text-sky-700',icon:'ℹ️'},
 emerald:{box:'border-emerald-500 bg-emerald-50',title:'text-emerald-700',icon:'✅'}
};
// Hidden badge: never mentioned in the UI until a perfect 30/30 is achieved
const HERO={id:'cyber_hero',icon:'🦸',name:'Cyber Hero'};

/* ================= TRAINING CONTENT ================= */
const MODULES=[
{id:'phishing',icon:'🎣',title:'Phishing',color:'sky',
 summary:'Deceptive messages that trick people into revealing information, paying fake invoices or installing malware.',
 badge:{id:'phishing',icon:'🎣',name:'Phish Hunter'},
 pages:[
  {t:'What is phishing and why does it matter?',lead:'Phishing is a type of social engineering in which a criminal poses as a trusted person or organisation to trick you into clicking a link, opening a file, sharing a password or approving a payment.',
   pts:['Most ransomware and account takeover incidents start with a deceptive message.','Phishing gets past firewalls because a person takes the final action.','One successful click can give an attacker access to email, files and payroll.','Attackers rely on urgency, fear, curiosity and authority.'],
   call:['rose','Why it is the most critical threat','It is cheap to launch at scale, works in every sector and needs only one person to make a mistake.']},
  {t:'Types of phishing',lead:'The channel changes, but the tactic is always the same: pretend to be someone you trust.',
   ex:[['Email phishing','Bulk emails pretending to be a bank, streaming service, HMRC or a delivery company, linking to a fake login page.'],
       ['Smishing (SMS phishing)','Texts that create urgency and push you to tap a link, such as a fake “redelivery fee”.'],
       ['Vishing (voice phishing)','Calls from someone claiming to be your bank’s fraud team or the police, demanding immediate action.'],
       ['Quishing (QR code phishing)','Malicious QR codes on emails, posters or parking meters that lead to fake payment pages.'],
       ['Social media and messaging','Messages from hacked accounts, fake job offers or friend requests on WhatsApp or LinkedIn.']],
   call:['amber','Remember','A legitimate organisation will never ask you to share a one-time code, password or PIN.']},
  {t:'Targeted phishing',lead:'Targeted attacks research the victim first, using real names, job titles, projects and suppliers.',
   ex:[['Spear phishing','A personalised attack aimed at one person or a small group, often referring to a real project or client.'],
       ['Whaling','Spear phishing aimed at senior executives, such as a fake legal letter marked urgent and confidential.'],
       ['Business email compromise (BEC)','Impersonating a senior leader or supplier to redirect payments, often from a lookalike domain.'],
       ['Clone phishing','A genuine earlier email is copied, altered and resent with a malicious link or attachment.']],
   call:['amber','Warning signs','Mismatched sender domains, unusual requests, and pressure to keep things secret or skip approval steps.']},
  {t:'Phishing by the numbers',lead:'Phishing consistently ranks among the most reported and most costly threats in the UK.',
   stats:[['84%','of UK businesses that identified a breach or attack in 2024 said phishing was one of the attack types (DSIT Cyber Security Breaches Survey)'],
          ['£1.17bn','total losses from fraud in the UK in 2024, many starting with a scam message or call (UK Finance)'],
          ['7726','the number to forward suspicious texts to, alongside the NCSC’s Suspicious Email Reporting Service']],
   call:['rose','Note on figures','Figures are approximate and drawn from UK government, regulator and industry reports. Check the latest editions before quoting them.']}
 ],
 practices:['Slow down. Urgency and threats are the biggest red flags.','Check the real sender address and hover over links before clicking.','Go to websites by typing the address or using a saved bookmark.','Verify unexpected requests using a number you already hold.','Forward suspicious texts to 7726 and suspicious emails to report@phishing.gov.uk.'],
 quiz:[
  {q:'An email says your account will be suspended in 24 hours unless you click a link. What should you do?',o:['Click the link and log in quickly','Report it, then visit the official site by typing the address yourself','Reply asking whether it is genuine','Forward it to colleagues to check'],a:1,x:'Manufactured urgency is a classic tactic. Report the message and navigate independently.'},
  {q:'Which channel is used in smishing?',o:['Voice calls','SMS and text messages','Printed letters','Video conferencing'],a:1,x:'Smishing uses texts that push victims to tap a link or call a number.'},
  {q:'What makes spear phishing different from mass phishing?',o:['It only uses phone calls','It is personalised using research about a specific target','It always contains malware','It is sent only at night'],a:1,x:'Spear phishing uses real names, roles and projects, which makes it far more convincing.'},
  {q:'A caller claiming to be from your bank asks you to read out a one-time code. What is this?',o:['Vishing','Whaling','Clone phishing','Pharming'],a:0,x:'Vishing is voice phishing. Legitimate banks never ask for one-time codes over the phone.'},
  {q:'What is the best defence against clone phishing?',o:['Ignore all emails from colleagues','Verify unexpected resends or changes through a separate channel','Enable macros in attachments','Delete your sent items folder'],a:1,x:'Clone phishing copies genuine messages, so verify changes through a second, trusted channel.'}
 ]},
{id:'passwords',icon:'🔑',title:'Passwords',color:'indigo',
 summary:'Strong, unique passwords and multi-factor authentication are your first line of defence for every account.',
 badge:{id:'passwords',icon:'🔐',name:'Digital Locksmith'},
 pages:[
  {t:'What makes a password strong?',lead:'Attackers rarely break passwords by brute force. They guess common choices, reuse leaked passwords or trick you into typing them into a fake page.',
   pts:['Length beats complexity. Three or four random words beat a short password full of symbols.','Predictable patterns such as Password1! are among the first guesses attackers try.','A unique password for each account limits the damage when one site is breached.','Never share your passwords, not even with IT staff.'],
   call:['sky','Think like an attacker','Attackers start with leaked password lists and personal details from social media, such as pet names and birth years.']},
  {t:'Types of password attacks',lead:'Knowing how passwords are attacked explains why the rules matter.',
   ex:[['Brute force','Systematically trying every combination. Short passwords fall quickly to modern hardware.'],
       ['Dictionary attack','Trying common words and passwords already seen in past data breaches.'],
       ['Credential stuffing','Reusing username and password pairs leaked from one site to log in to other services.'],
       ['Password spraying','Trying one common password across many accounts to avoid triggering lockouts.']]},
  {t:'Multi-factor authentication and password managers',lead:'Modern protection combines a strong password with a second factor and a tool that manages everything.',
   ex:[['Multi-factor authentication (MFA)','Requires a second factor such as a code, device or fingerprint, so a stolen password alone is not enough.'],
       ['Authenticator apps and security keys','Stronger than SMS codes, which can be intercepted through SIM-swap fraud.'],
       ['Password managers','Generate and store unique passwords, and autofill them only on the matching website.'],
       ['Passkeys','Sign-in tied to your device and confirmed by fingerprint, face or PIN. Resistant to phishing.']],
   call:['sky','Avoid these habits','Do not store passwords in notes, spreadsheets or on paper near your device.']},
  {t:'Password and sign-in statistics',lead:'Stolen and weak credentials are among the most common ways attackers get into accounts.',
   stats:[['99.9%','of account compromise attacks are blocked by multi-factor authentication, according to Microsoft’s published research'],
          ['3 words','NCSC guidance suggests three random words as a strong, memorable password for many accounts'],
          ['Email first','Protect your email first, because it can be used to reset the passwords for your other accounts']],
   call:['rose','One leak, many losses','A password leaked from a small website can unlock your bank and work accounts if you reuse it.']}
 ],
 practices:['Use three or four random words for every important account.','Use a password manager so every site has a unique password.','Turn on MFA everywhere it is offered, preferring app codes, passkeys or security keys.','Never share passwords or enter one after arriving from a link in a message.','Change a password straight away if a service you use reports a breach.'],
 quiz:[
  {q:'Which is the strongest password choice?',o:['Password123!','Summer2024','copper-lantern-orbit-maple','Your date of birth'],a:2,x:'Long random passphrases are far harder to crack than short or personal passwords.'},
  {q:'Why is password reuse dangerous?',o:['It makes passwords harder to remember','A breach on one site can expose the same login elsewhere through credential stuffing','It slows the login process','It disables MFA'],a:1,x:'Attackers automatically test leaked username and password pairs across many services.'},
  {q:'Which MFA method is most resistant to phishing?',o:['SMS code','Email code','Hardware security key or passkey','Security questions'],a:2,x:'Hardware keys and passkeys are bound to the genuine website, so they fail on lookalike sites.'},
  {q:'What is password spraying?',o:['Trying one common password across many accounts','Sending spam to many inboxes','Copying a password from a sticky note','Resetting passwords in bulk'],a:0,x:'It tests one common password against many accounts to avoid triggering lockouts.'},
  {q:'What is the main benefit of a password manager’s autofill?',o:['It fills passwords on any site','It fills credentials only on the site they were saved for, which helps resist lookalike sites','It shares passwords with your team','It removes the need for MFA'],a:1,x:'If autofill does not appear on a site, check the address carefully before entering anything.'}
 ]},
{id:'malware',icon:'🦠',title:'Malware',color:'rose',
 summary:'Malicious software such as ransomware, spyware and trojans damages systems and steals data.',
 badge:{id:'malware',icon:'🩺',name:'Malware Medic'},
 pages:[
  {t:'What is malware?',lead:'Malware is any software designed to damage, disrupt, spy on or gain unauthorised access to a device or network. It arrives through emails, downloads, USB drives, unpatched software and fake updates.',
   pts:['Malware is usually delivered by people: someone clicks, opens or installs something.','Modern malware can stay hidden for weeks, quietly collecting passwords.','Once inside a network, attackers move sideways to reach data and backups.','Keeping software updated on every device is a shared responsibility.'],
   call:['rose','Why it matters','One infected laptop can encrypt shared drives, expose customer data and disrupt operations for days.']},
  {t:'Types of malware',lead:'Each type of malware has a different goal, so each leaves different warning signs.',
   ex:[['Ransomware','Encrypts files and demands payment. Many groups also steal data first and threaten to publish it.'],
       ['Trojans','Disguise themselves as legitimate software, games or documents while secretly installing a backdoor.'],
       ['Spyware and infostealers','Record keystrokes and screens, and steal saved passwords and session cookies.'],
       ['Cryptominers','Use your device’s processing power to mine cryptocurrency, often making it slow and hot.']]},
  {t:'How malware gets in',lead:'Malware usually arrives through a route that looks ordinary. Knowing these routes helps you pause at the right moment.',
   ex:[['Malicious macros','Office files that run scripts once “Enable Content” is clicked. Keep macros off for unknown senders.'],
       ['Drive-by downloads','Visiting a compromised website, or an advert on one, can install malware without a click.'],
       ['Pirated software','Cracked software and key generators are a common way to bundle malware with a “free” program.'],
       ['Fake updates','Pop-ups or emails posing as browser or system updates that download a harmful file.']],
   call:['amber','Layered defence','Patching, endpoint protection, least privilege and offline backups work best together.']},
  {t:'Real-world malware impact',lead:'Malware incidents are among the most disruptive cyber events in the UK, and recovery is often slower than the attack itself.',
   stats:[['June 2024','A ransomware attack on pathology provider Synnovis disrupted NHS hospitals across south London, cancelling thousands of appointments'],
          ['£1.9bn','estimated economic cost to the UK of the 2025 Jaguar Land Rover cyber attack, which halted production for weeks (Cyber Monitoring Centre estimate)'],
          ['3-2-1','backup rule: three copies, on two media types, with one copy offline or away from your network']],
   call:['rose','Real-world impact','Recovery depends on tested, isolated backups. Without them, organisations can face weeks of disruption.']}
 ],
 practices:['Keep operating systems, browsers and applications patched and up to date.','Keep macros disabled in documents from unknown senders.','Only install software from official app stores or verified vendor websites.','Maintain tested, offline or immutable backups following the 3-2-1 rule.','If a device behaves strangely or files are locked, disconnect it and report it immediately.'],
 quiz:[
  {q:'What is the primary goal of ransomware?',o:['Speed up your device','Encrypt files and demand payment for their recovery','Display adverts','Clean the system registry'],a:1,x:'Ransomware locks data through encryption and extorts victims for the decryption key.'},
  {q:'How are malicious macros usually activated?',o:['Opening a PDF','Clicking Enable Content in an untrusted Office file','Restarting the computer','Printing the document'],a:1,x:'Macros run when the user enables content, so untrusted documents should stay locked down.'},
  {q:'What is the best defence against the impact of ransomware?',o:['Antivirus software alone','Tested, offline or immutable backups combined with timely patching','Disabling updates','Turning off the firewall'],a:1,x:'Good backups let you restore without paying, and patching closes the entry points.'},
  {q:'What is a trojan?',o:['Malware disguised as legitimate software','A type of firewall','A backup file format','A password manager'],a:0,x:'Trojans rely on deception, appearing useful while secretly doing harm.'},
  {q:'Your device is slow and the fan runs constantly while idle. What might this indicate?',o:['Normal behaviour after an update','A possible cryptominer','Improved battery performance','A faulty keyboard'],a:1,x:'Unexplained high processor use with nothing open can indicate cryptomining malware.'}
 ]},
{id:'wifi',icon:'📶',title:'Public Wi-Fi',color:'teal',
 summary:'Public networks in cafés, airports and hotels can be monitored or spoofed. Protect your traffic before you connect.',
 badge:{id:'wifi',icon:'📡',name:'Network Ranger'},
 pages:[
  {t:'Why public Wi-Fi is risky',lead:'Public Wi-Fi is convenient but shared with strangers. Anyone on the same network can attempt to observe or manipulate unprotected traffic, and fake hotspots can look legitimate.',
   pts:['Open networks may have no encryption between your device and the access point.','Attackers can run man-in-the-middle attacks to intercept or alter traffic.','Devices that auto-connect to known networks can silently join a rogue hotspot.','If file sharing is on, other people on the network may see your device.'],
   call:['sky','Golden rule','Treat every public network as untrusted, even when it asks for a password.']},
  {t:'Common Wi-Fi threats',lead:'Most public Wi-Fi attacks exploit trust in a familiar network name or an unencrypted connection.',
   ex:[['Evil twin','A rogue hotspot copies a legitimate network name so devices connect automatically.'],
       ['Man-in-the-middle (MITM)','An attacker sits between you and the internet, reading or changing traffic.'],
       ['Session hijacking','Stealing a session cookie to access an account without knowing the password.'],
       ['Captive portal phishing','Fake Wi-Fi sign-in pages that ask for email or social media details before you get online.']]},
  {t:'Protecting yourself on public Wi-Fi',lead:'A few deliberate steps make public networks far safer to use.',
   ex:[['VPN (virtual private network)','Encrypts all traffic from your device to a trusted endpoint. Many organisations provide a work VPN.'],
       ['HTTPS','Encrypts data between your browser and the website. Check the padlock and the domain, as fake sites can use HTTPS too.'],
       ['Public network profile','On Windows and macOS, a Public profile blocks network discovery and file sharing.'],
       ['Mobile hotspot','Using your phone’s mobile data is often safer than an unknown café network for sensitive work.']],
   call:['amber','Remember','HTTPS protects the content of your traffic, but it does not stop fake websites. Always check the domain too.']},
  {t:'Public Wi-Fi by the numbers',lead:'Encryption has improved greatly, but rogue hotspots remain a practical way to capture logins.',
   stats:[['90%+','of web pages loaded in Google Chrome worldwide are now encrypted with HTTPS (Google Transparency Report)'],
          ['Auto-join','is the setting that lets a device silently join a rogue network. Turn it off for open networks'],
          ['Mobile data','NCSC guidance suggests using a VPN or mobile data for sensitive activity on public networks']],
   call:['rose','Real-world impact','Rogue hotspots have been used at conferences, airports and hotels to capture login details from many visitors at once.']}
 ],
 practices:['Use a reputable VPN, or your phone’s hotspot, on any network you do not control.','Confirm the exact network name with staff before connecting.','Turn off auto-connect for open networks and forget networks you no longer use.','Set new networks to Public so file sharing is disabled.','Avoid banking on open networks unless you are using a VPN.'],
 quiz:[
  {q:'What is an evil twin attack?',o:['A fast VPN service','A fake hotspot that copies a legitimate network name','A router firmware update','A shared printer exploit'],a:1,x:'The attacker copies a familiar network name so devices connect and route traffic through them.'},

/* ================= HELPERS & STATE ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{const t=Math.ceil(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
const today=()=>new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'learner';
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// Options are shuffled each time so the correct answer never follows a pattern
function prepQ(r){const ord=shuffle([...r.o.keys()]);return{q:r.q,topic:r.t||null,options:ord.map(i=>r.o[i]),answer:ord.indexOf(r.a),explain:r.x}}
const ALL_BADGES=MODULES.map(m=>m.badge);

const defState=()=>({user:'',progress:{},quizzes:{},badges:[],exam:null});
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORE_KEY));return s&&typeof s==='object'?{...defState(),...s}:defState()}catch(e){return defState()}}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){toast('Progress could not be saved.')}}
let state=loadState();
let view={name:state.user?'dashboard':'onboard',id:null,page:0};
let Q=null,tickId=null,urlGame={},cardBlob=null,cardUrl=null;

const totalPoints=()=>Object.values(state.quizzes).reduce((a,q)=>a+(q.bestScore||0),0)+(state.exam?state.exam.bestScore||0:0);
const lessonsDone=()=>MODULES.filter(m=>(state.progress[m.id]??-1)>=PAGES-1).length;
const avgQuiz=()=>{const r=Object.values(state.quizzes);return r.length?Math.round(r.reduce((a,q)=>a+q.best,0)/r.length):0};
const badgesEarned=()=>ALL_BADGES.filter(b=>state.badges.includes(b.id)).length;
const heroEarned=()=>state.badges.includes(HERO.id);
const isDark=()=>document.documentElement.classList.contains('dark');
function rankFor(p){
 if(p>=90)return{name:'Cyber Champion',icon:'🏆',msg:'Outstanding. You think like a defender.'};
 if(p>=75)return{name:'Security Guardian',icon:'🔒',msg:'Excellent awareness with a few details to sharpen.'};
 if(p>=60)return{name:'Cyber Defender',icon:'⚔️',msg:'A solid foundation. Review the topics you missed.'};
 return{name:'Security Apprentice',icon:'🌱',msg:'A good start. Revisit the training and try again.'};
}
function awardBadge(id){if(state.badges.includes(id))return false;state.badges.push(id);return true}

/* ================= UI HELPERS ================= */
function showModal(){const m=$('#modal');m.classList.remove('hidden');m.classList.add('flex')}
function closeModal(){const m=$('#modal');m.classList.add('hidden');m.classList.remove('flex')}
let toastTimer=null;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('translate-y-24','opacity-0');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('translate-y-24','opacity-0'),2800)}
function toggleTheme(){const d=!isDark();document.documentElement.classList.toggle('dark',d);try{localStorage.setItem(THEME_KEY,d?'dark':'light')}catch(e){}renderHeader()}

/* ================= ROUTING ================= */
function go(name,id=null,page=0){
 if(view.name==='quiz'&&name!=='quiz'&&Q&&!Q.done){if(!confirm('Leave this quiz? This attempt will not be saved.'))return;stopTimer();Q=null}
 if(name==='lesson'&&(state.progress[id]??-1)<page){state.progress[id]=page;saveState()}
 view={name,id,page};render();window.scrollTo({top:0,behavior:'smooth'});
}
function render(){
 if((view.name==='quiz'||view.name==='summary')&&!Q)view={name:'dashboard',id:null,page:0};
 if(view.name==='results'&&!state.exam)view={name:'dashboard',id:null,page:0};
 renderHeader();
 const v={onboard:viewOnboard,dashboard:viewDashboard,lesson:()=>viewLesson(view.id,view.page),quiz:viewQuiz,summary:viewSummary,results:viewResults};
 $('#app').innerHTML=(v[view.name]||viewDashboard)();
}
function renderHeader(){
 const r=$('#hdr-right');
 const theme=`<button onclick="toggleTheme()" class="btn btn-ghost btn-sm">${isDark()?'☀️ Light':'🌙 Dark'}</button>`;
 if(!state.user){r.innerHTML=theme;return}
 const pill=state.exam

function startQuiz(id){

}

 beginSession({kind:'exam',id:'exam',title:'Final Assessment',icon:'🎓',qs:shuffle(EXAM).map(prepQ),totalMs:EXAM.length*EXAM_SEC*1000});
}
function beginSession(o){
 stopTimer();
 Q={...o,idx:0,score:0,streak:0,bestStreak:0,answers:new Array(o.qs.length).fill(null),selected:-1,submitted:false,done:false,startTime:Date.now(),result:null};
 view={name:'quiz',id:o.id,page:0};render();window.scrollTo({top:0,behavior:'smooth'});startTimer();
}
const remainingMs=()=>Math.max(0,Q.totalMs-(Date.now()-Q.startTime));
function startTimer(){stopTimer();tickId=setInterval(tick,250);tick()}
function stopTimer(){if(tickId)clearInterval(tickId);tickId=null}
function tick(){if(!Q||Q.done)return;const r=remainingMs();updateTimer(r);if(r<=0)finishQuiz(true)}
const clockCls=p=>`font-mono text-3xl font-extrabold tabular-nums ${p>20?'':'text-rose-600'}`;
const barCls=p=>`h-full rounded-full bar ${p>50?'bg-emerald-500':p>20?'bg-amber-500':'bg-rose-500 animate-pulse'}`;
function updateTimer(r){
 const c=$('#clock'),b=$('#tbar');if(!c||!b)return;
 const p=r/Q.totalMs*100;c.textContent=fmt(r);c.className=clockCls(p);b.style.width=p+'%';b.className=barCls(p);
}
function optCls(i){
 const q=Q.qs[Q.idx],base='opt flex items-center gap-4 text-left rounded-xl border-2 px-5 py-4 font-medium';

  if(i===q.answer)return `${base} border-emerald-500 bg-emerald-50 text-emerald-900`;
  if(i===Q.selected)return `${base} border-rose-500 bg-rose-50 text-rose-900`;
  return `${base} border-slate-200 opacity-70`;
 }
 if(i===Q.selected)return `${base} border-indigo-500 bg-indigo-50 ring-2 ring-indigo-200 text-indigo-900`;
 return `${base} border-slate-200 bg-white hover:border-indigo-300`;
}

  ?`${Q.idx>0?`<button onclick="prev()" class="btn btn-ghost">← Previous</button>`:'<span></span>'}<button onclick="next()" class="btn btn-dark">${last?'Finish assessment 🏁':'Next question →'}</button>`

function pick(i){
 if(!Q||Q.done||(Q.kind==='module'&&Q.submitted))return;
 Q.selected=i;
 document.querySelectorAll('#opts button').forEach((b,j)=>{b.className=optCls(j);b.setAttribute('aria-checked',String(j===i))});

// Stores the current answer. Module points are calculated here; exam points are calculated at the end.
function commitAnswer(){
 const q=Q.qs[Q.idx],correct=Q.selected>=0&&Q.selected===q.answer;
 let pts=0;
 if(Q.kind==='module'){
  if(correct){Q.streak++;Q.bestStreak=Math.max(Q.bestStreak,Q.streak);pts=POINTS+(Q.streak>=3?STREAK_BONUS:0);Q.score+=pts}
  else Q.streak=0;
 }
 Q.answers[Q.idx]={selected:Q.selected,correct,pts};
}
function submitAnswer(){
 if(!Q||Q.done||Q.kind!=='module'||Q.submitted)return;
 if(Q.selected<0){toast('Choose an answer first.');$('#qcard')?.classList.add('shake');setTimeout(()=>$('#qcard')?.classList.remove('shake'),400);return}

function prev(){
 if(!Q||Q.kind!=='exam'||Q.idx===0)return;
 commitAnswer();Q.idx--;Q.selected=Q.answers[Q.idx]?Q.answers[Q.idx].selected:-1;render();
}
function next(){
 if(!Q||Q.done)return;
 if(Q.kind==='module'&&!Q.submitted)return;
 if(Q.kind==='exam')commitAnswer();
 if(Q.idx<Q.qs.length-1){
  Q.idx++;Q.selected=Q.kind==='exam'&&Q.answers[Q.idx]?Q.answers[Q.idx].selected:-1;Q.submitted=false;render();return;
 }
 if(Q.kind==='exam'){
  const skipped=Q.answers.filter(a=>!a||a.selected<0).length;
  if(skipped>0&&!confirm(`You have ${skipped} unanswered question${skipped>1?'s':''}. Finish the assessment now?`))return;
 }
 finishQuiz(false);
}
function finishQuiz(timedOut){
 if(!Q||Q.done)return;
 stopTimer();
 const rem=remainingMs();Q.done=true;
 const n=Q.qs.length;
 if(Q.kind==='exam')commitAnswer();
 for(let i=0;i<n;i++)if(!Q.answers[i])Q.answers[i]={selected:-1,correct:false,pts:0};
 if(Q.kind==='exam')Q.score=Q.answers.filter(a=>a.correct).length*POINTS;
 const correct=Q.answers.filter(a=>a.correct).length;
 const pct=Math.round(correct/n*100),perfect=!timedOut&&correct===n;
 const timeUsedMs=Q.totalMs-rem;
 const items=Q.qs.map((q,i)=>({q:q.q,options:q.options,answer:q.answer,explain:q.explain,sel:Q.answers[i].selected,correct:Q.answers[i].correct}));
 const earned=[];
 const entry=(prevHist)=>({attempt:prevHist.length+1,pct,correct,n,points:Q.score,timeUsedMs,timedOut,date:today()});
 if(Q.kind==='module'){
  const mod=MODULES.find(m=>m.id===Q.id);
  const prev=state.quizzes[Q.id]||{best:0,bestScore:0,history:[]};
  const history=[...(prev.history||[]),entry(prev.history||[])];
  state.quizzes[Q.id]={best:Math.max(prev.best,pct),bestScore:Math.max(prev.bestScore,Q.score),attempts:history.length,history};
  if(perfect&&awardBadge(mod.badge.id))earned.push(mod.badge);
 } else {
  const prev=state.exam||{bestPct:0,bestScore:0,history:[]};
  const history=[...(prev.history||[]),entry(prev.history||[])];
  state.exam={bestPct:Math.max(prev.bestPct,pct),bestScore:Math.max(prev.bestScore,Q.score),attempts:history.length,history,review:items};
  if(perfect&&awardBadge(HERO.id))earned.push(HERO);
 }
 saveState();
 const history=Q.kind==='module'?state.quizzes[Q.id].history:state.exam.history;
 Q.result={pct,correct,n,timedOut,perfect,rank:rankFor(pct),timeUsedMs,remainingMs:rem,earned,history,attempts:history.length,items};
 view={name:'summary',id:Q.id,page:0};render();window.scrollTo({top:0,behavior:'smooth'});
 if(timedOut)toast("⏰ Time's up! Unanswered questions were counted as incorrect.");
 else if(earned.length&&earned[0].id!==HERO.id)toast('🏅 New badge unlocked: '+earned[0].name);
}

function historyTable(history){
 if(!history||!history.length)return '';
 const latest=history[history.length-1].attempt;
 const rows=[...history].reverse().map(h=>`<tr class="${h.attempt===latest?'font-bold bg-indigo-50/60':''} border-t border-slate-100">
  <td class="py-2.5 pr-4">${h.attempt}${h.attempt===latest?' <span class="text-xs text-indigo-600">(latest)</span>':''}</td>
  <td class="py-2.5 pr-4">${esc(h.date)}</td>
  <td class="py-2.5 pr-4">${h.correct}/${h.n} (${h.pct}%)</td>
  <td class="py-2.5 pr-4 font-mono">${fmt(h.timeUsedMs)}</td>
  <td class="py-2.5">${h.points} pts${h.timedOut?' <span class="text-xs text-amber-700">· timed out</span>':''}</td></tr>`).join('');
 return `<div class="card mt-6 overflow-x-auto"><h2 class="text-lg font-bold mb-3">🗂️ Your attempts</h2>
  <table class="w-full text-sm text-left"><thead class="text-xs uppercase tracking-wide text-slate-500"><tr>
  <th class="pb-2 pr-4">Attempt</th><th class="pb-2 pr-4">Date</th><th class="pb-2 pr-4">Score</th><th class="pb-2 pr-4">Time taken</th><th class="pb-2">Points</th></tr></thead>
  <tbody>${rows}</tbody></table></div>`;
}

     </svg>
     <div class="absolute inset-0 grid place-items-center text-center"><div><p class="text-4xl font-extrabold">${r.pct}%</p><p class="text-xs text-slate-500">accuracy</p></div></div>
    </div>
   </div>
   <div class="md:col-span-2 grid grid-cols-2 gap-4">
    ${[['Points',Q.score+' pts'],['Correct',`${r.correct} / ${r.n}`],['Best streak',isExam?'—':'🔥 '+Q.bestStreak],['Time used',fmt(r.timeUsedMs)],['Time remaining',fmt(r.remainingMs)],['Attempts',r.attempts]]
      .map(([l,v])=>`<div class="card"><p class="text-xs uppercase font-bold tracking-wide text-slate-500">${l}</p><p class="text-2xl font-extrabold mt-1">${v}</p></div>`).join('')}
   </div>
  </div>
  <div class="card mt-6"><h2 class="text-lg font-bold mb-3">🏅 Badge status</h2>${badgeBlock}</div>
  ${historyTable(r.history)}
  <div class="mt-8 flex flex-wrap gap-3 justify-center">

   ${nm?`<button onclick="startQuiz('${nm.id}')" class="btn btn-ghost">Next: ${esc(nm.title)} quiz →</button>`:''}
   <button onclick="go('dashboard')" class="btn btn-dark">🏠 Dashboard</button>

 </section>`;
}

function reviewLastExam(){
 if(!state.exam||!state.exam.review){toast('No review available yet. Retake the assessment to see your answers.');return}
 openReview(state.exam.review,'Final Assessment');
}

/* ================= REVIEW MODAL ================= */
function openReview(items,title){
 if(!items||!items.length){toast('No review available yet.');return}
 const correct=items.filter(i=>i.correct).length;
 const list=items.map((it,i)=>{
  const na=it.sel<0;
  const st=na?{t:'Not answered',c:'bg-amber-100 text-amber-800',ic:'⏰'}:it.correct?{t:'Correct',c:'bg-emerald-100 text-emerald-800',ic:'✅'}:{t:'Incorrect',c:'bg-rose-100 text-rose-800',ic:'❌'};
  return `<div class="rounded-xl border p-4 ${it.correct?'border-emerald-200 bg-emerald-50/40':'border-rose-200 bg-rose-50/40'}">
   <div class="flex justify-between items-start gap-3"><p class="font-semibold">Q${i+1}. ${esc(it.q)}</p>
   <span class="shrink-0 text-xs font-bold px-2 py-1 rounded-full ${st.c}">${st.ic} ${st.t}</span></div>
   <p class="mt-2 text-sm"><span class="text-slate-500">Your answer:</span> ${na?'<em>No answer</em>':esc(it.options[it.sel])}</p>
   ${!it.correct?`<p class="text-sm"><span class="text-slate-500">Correct answer:</span> <strong class="text-emerald-700">${esc(it.options[it.answer])}</strong></p>`:''}
   <p class="mt-2 text-sm text-slate-700">💡 ${esc(it.explain)}</p></div>`;
 }).join('');
 $('#modal-body').innerHTML=`<div class="flex flex-wrap items-center justify-between gap-2 mb-4">
   <h3 class="text-xl font-bold">📋 Review · ${esc(title)}</h3>
   <p class="text-sm font-semibold text-slate-600">✅ ${correct} correct · ❌ ${items.length-correct} incorrect</p></div>
  <div class="space-y-3">${list}</div>`;
 showModal();
}

/* ================= ACHIEVEMENT CARD (canvas: download or share) ================= */
async function buildCard(){
 try{await document.fonts.load('800 40px Inter');await document.fonts.load('400 24px Inter')}catch(e){}
 const W=1200,H=960,c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d'),F='Inter, system-ui, sans-serif',hero=heroEarned(),best=state.exam.bestPct,rank=rankFor(best);
 const rr=(X,Y,w,h,r)=>{x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()};
 const txt=(s,X,Y,size,wt,col,al='left')=>{x.font=`${wt} ${size}px ${F}`;x.fillStyle=col;x.textAlign=al;x.fillText(s,X,Y)};
 const fit=(s,X,Y,maxW,size,wt,col)=>{let z=size;do{x.font=`${wt} ${z}px ${F}`;z-=2}while(x.measureText(s).width>maxW&&z>22);x.fillStyle=col;x.textAlign='left';x.fillText(s,X,Y)};

 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,hero?'#78350f':'#312e81');g.addColorStop(1,hero?'#b45309':'#0369a1');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.arc(W-120,120,260,0,Math.PI*2);x.fill();x.beginPath();x.arc(60,H-40,220,0,Math.PI*2);x.fill();

 txt('INFOSEC ACADEMY',80,90,30,800,'#ffffff');
 txt('Training & Awareness',80,126,22,400,'#bae6fd');
 if(hero){rr(W-380,52,300,58,29);x.fillStyle='#fde68a';x.fill();txt('🦸 CYBER HERO',W-230,92,26,800,'#451a03','center')}

 txt('CYBER AWARENESS ACHIEVEMENT',80,200,22,700,'#fcd34d');
 fit(state.user,80,266,1040,84,800,'#ffffff');
 txt(`Rank: ${rank.icon} ${rank.name}`,80,322,34,700,'#bae6fd');

 const stats=[['TOTAL POINTS',String(totalPoints())],['ASSESSMENT BEST',best+'%'],['BADGES',`${badgesEarned()}/${ALL_BADGES.length}`]];
 stats.forEach(([l,v],i)=>{const X=80+i*350;rr(X,360,320,130,22);x.fillStyle='rgba(255,255,255,.14)';x.fill();txt(l,X+24,408,18,700,'#bae6fd');txt(v,X+24,467,50,800,'#ffffff')});

 txt('BADGES EARNED',80,555,22,700,'#fcd34d');
 const list=ALL_BADGES.filter(b=>state.badges.includes(b.id)).map(b=>`${b.icon} ${b.name}`);
 if(hero)list.push(`🦸 ${HERO.name}`);
 if(!list.length)txt('No module badges yet. Keep learning!',80,600,26,400,'#e0e7ff');
 else{
  let X=80,Y=578;
  list.forEach(label=>{
   x.font=`600 24px ${F}`;const w=x.measureText(label).width+40;
   if(X+w>1120){X=80;Y+=62}
   rr(X,Y,w,48,24);x.fillStyle=label.startsWith('🦸')?'#fbbf24':'rgba(255,255,255,.2)';x.fill();
   txt(label,X+20,Y+33,24,600,label.startsWith('🦸')?'#451a03':'#ffffff');
   X+=w+14;
  });
 }

 if(hero){
  rr(80,740,1040,120,24);x.fillStyle='rgba(251,191,36,.18)';x.fill();
  txt('🦸 CYBER HERO',110,790,34,800,'#fde68a');
  txt('A perfect 30 out of 30. You are a true guardian of your organisation’s data.',110,834,24,400,'#ffffff');
 }
 txt(`Issued ${today()} · Verified in InfoSec Academy`,80,H-40,20,400,'#bae6fd');
 return c;
}

async function openShareCard(){
 if(!state.exam){toast('Complete the Final Assessment to create your badge.');return}
 const canvas=await buildCard();
 cardBlob=await new Promise(res=>canvas.toBlob(res,'image/png'));
 if(cardUrl)URL.revokeObjectURL(cardUrl);
 cardUrl=URL.createObjectURL(cardBlob);
 const fname=`infosec-achievement-${slug(state.user)}.png`;
 const canShareFiles=!!(navigator.canShare&&navigator.canShare({files:[new File([cardBlob],fname,{type:'image/png'})]}));
 $('#modal-body').innerHTML=`
  <h3 class="text-xl font-bold mb-4">📤 Your achievement badge</h3>
  <img src="${cardUrl}" alt="Your InfoSec Academy achievement badge" class="w-full rounded-2xl shadow-lg border border-slate-200">
  <div class="mt-5 flex flex-wrap gap-3 justify-center">
   <a href="${cardUrl}" download="${fname}" class="btn btn-primary">⬇️ Download PNG</a>
   ${canShareFiles?`<button onclick="shareCard('${fname}')" class="btn btn-dark">📤 Share</button>`:''}
  </div>
  <p class="text-xs text-slate-500 text-center mt-4">Download the image and post it on LinkedIn, Teams or anywhere you like. Sharing directly is available on phones and supported browsers.</p>`;
 showModal();
}
async function shareCard(fname){
 try{
  const file=new File([cardBlob],fname,{type:'image/png'});
  await navigator.share({files:[file],title:'My InfoSec Academy achievement',text:`${state.user} scored ${state.exam.bestPct}% on the InfoSec Academy Final Assessment.`});
 }catch(e){ if(e&&e.name!=='AbortError')toast('Sharing was not available. Please use Download instead.') }
}

/* ================= PROFILE ================= */
function resetProfile(){
 if(!confirm('Reset your profile? This clears your name, scores, badges and progress on this device.'))return;
 stopTimer();localStorage.removeItem(STORE_KEY);
 state=defState();Q=null;urlGame={};
 view={name:'onboard',id:null,page:0};closeModal();render();
 toast('Profile reset. Enter your name to begin again.');
}

/* ================= KEYBOARD ================= */
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();return}
 if(view.name!=='quiz'||!Q||Q.done||!$('#modal').classList.contains('hidden'))return;
 if(/^[1-4]$/.test(e.key)){const i=Number(e.key)-1;if(i<Q.qs[Q.idx].options.length)pick(i)}
 else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){
  if(Q.kind==='module')Q.submitted?next():submitAnswer();
  else next();
 }
});

/* ================= BOOT ================= */
render();
</script>
